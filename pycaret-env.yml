name: pycaret-env
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11

  # Numeric & ML stack (versions we stabilized)
  - numpy=1.26.4
  - scipy=1.10.1
  - scikit-learn=1.4.2
  - pandas
  - matplotlib
  - seaborn

  # BLAS backend (matches what we used)
  - blas=*=openblas

  # Jupyter + kernel
  - jupyterlab
  - ipykernel

  # Let pip handle PyCaret itself
  - pip

  - pip:
      - pycaret==3.3.2
